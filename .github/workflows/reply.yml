name: Nightshift reply

# The owner's reply on an open Nightshift question starts a Nightshift run instead of
# waiting for the schedule. Kept separate from the agent workflow so comment events,
# which anyone can create on a public repository, never enter its concurrency group.
#
# Called from the target repository's nightshift-reply.yml on `issue_comment: [created]`
# with `permissions: {}` at the top and actions and issues write permissions on the
# calling job.
on:
  workflow_call:
    inputs:
      agent-workflow:
        description: The caller workflow that runs the agent, dispatched on the default branch
        type: string
        required: false
        default: nightshift.yml

permissions: {}

jobs:
  start-run:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'nightshift:needs-you')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    permissions:
      actions: write
      issues: write
    steps:
      - name: Dispatch a Nightshift run and acknowledge the reply
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          AGENT_WORKFLOW: ${{ inputs.agent-workflow }}
          NIGHTSHIFT_BASE: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run "$AGENT_WORKFLOW" --ref "$NIGHTSHIFT_BASE"
          # A thumbs-up on the owner's comment shows the reply was picked up.
          gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content='+1' >/dev/null \
            || echo "::warning::Could not react to the comment"
