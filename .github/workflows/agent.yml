name: Nightshift agent

# Unattended Codex runs toward the goal in .nightshift/GOALS.md. Work lands on the
# working branch behind a draft PR into the default branch. Run reports and owner
# questions are posted as GitHub comments and issues that mention the owner, so they
# arrive by email.
#
# The agent job sets up everything that needs root, starts a model-key proxy under a
# separate user, and drops root before any branch content runs. No branch code runs
# before the agent itself, so nothing can redirect the harness. From then on the job
# is treated as agent-controlled: it holds only a read-only token and restore-only
# cache access, and hands its commits over as a git bundle. The publish job runs on a
# fresh runner, validates the bundle, rewrites commit identity, pushes, and posts. It
# never executes repository code.
#
# The caller supplies the schedule and dispatch triggers and the workflow-level
# concurrency group, so runs never overlap.
on:
  workflow_call:
    inputs:
      model:
        description: Primary model override; empty uses agent.model from the configuration
        type: string
        default: ''
      minutes:
        description: Agent time budget override in minutes; empty uses agent.minutes
        type: string
        default: ''
      base-url:
        description: Overrides agent.base_url, for example from a repository variable; empty uses the config
        type: string
        default: ''
      config-path:
        description: Configuration file, read from the default branch
        type: string
        default: .nightshift/config.yml
    secrets:
      model-api-key:
        description: Key for agent.base_url; only the key proxy ever holds it
        required: true

permissions: {}

env:
  OWNER: ${{ github.repository_owner }}
  # A schedule event carries no repository payload, but it always runs on the default
  # branch, so its ref names it.
  NIGHTSHIFT_BASE: ${{ github.event.repository.default_branch || github.ref_name }}
  NEEDS_YOU_LABEL: 'nightshift:needs-you'
  LOG_ISSUE_TITLE: Nightshift run log

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Restore-only: the cache service refuses saves from this job's token, so nothing
    # the agent controls can plant entries in the default branch's cache scope.
    cache-mode: read
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      mode: ${{ steps.branch.outputs.mode }}
      base: ${{ steps.branch.outputs.base }}
      remote: ${{ steps.branch.outputs.remote }}
      conflict: ${{ steps.branch.outputs.conflict }}
      bundle: ${{ steps.bundle.outputs.bundle }}
      # Read from the default branch before the agent ran, so the agent cannot change them.
      branch: ${{ steps.harness.outputs.branch }}
      identity-name: ${{ steps.harness.outputs.identity-name }}
      identity-email: ${{ steps.harness.outputs.identity-email }}
      ci-workflow: ${{ steps.harness.outputs.ci-workflow }}
      ci-approval: ${{ steps.harness.outputs.ci-approval }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.NIGHTSHIFT_BASE }}
          fetch-depth: 0
          persist-credentials: false

      # Root-owned copy of the harness, configuration, and goals from the default
      # branch. The agent cannot change its own script, instructions, checks, model
      # configuration, or goals, even on its branch.
      - name: Install the harness and read the configuration
        id: harness
        uses: swayamg20/nightshift/harness@main
        with:
          config-path: ${{ inputs.config-path }}
          base-url: ${{ inputs.base-url }}

      - name: Check status in GOALS.md
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          STATUS: ${{ steps.harness.outputs.status }}
          NIGHTSHIFT_BRANCH: ${{ steps.harness.outputs.branch }}
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          status="$STATUS"
          # A scheduled run has nothing to do while a question waits on the owner, and its
          # memory-only commit would move the PR past the report the owner is reading.
          # The owner's reply starts a run immediately; a manual dispatch always runs.
          if [[ "$status" == running && "$EVENT" == schedule ]]; then
            waiting="$(gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 50 --json number,comments \
              --jq '[.[] | select([.comments[] | select(.author.login == env.OWNER)] | length == 0) | "#\(.number)"] | join(" ")' \
              || true)"
            # Review findings or failing checks on the open PR are work the agent can do
            # without the owner, so they keep the run going.
            feedback="$(bash /opt/nightshift-harness/pr-feedback.sh count 2>/dev/null || echo 0)"
            if [[ -n "$waiting" && "$feedback" == 0 ]]; then
              echo "::notice::Waiting on the owner's answer to $waiting; skipping this scheduled run."
              status=waiting
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Nightshift status: ${status:-missing}"

      - name: Prepare output directory
        id: prep
        if: steps.gate.outputs.status == 'running'
        env:
          MINUTES: ${{ inputs.minutes || steps.harness.outputs.minutes }}
        run: |
          mkdir -p "$RUNNER_TEMP/nightshift/questions"
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::The agent time budget must be a whole number of minutes."
            exit 1
          fi
          # The job's 300-minute timeout also has to cover setup, Verify, and the
          # hand-off; a run cut off by it would lose its commits.
          if ((MINUTES > 240)); then
            echo "::warning::Capping the agent time budget at 240 minutes."
            MINUTES=240
          fi
          echo "deadline=$(( $(date +%s) + MINUTES * 60 ))" >> "$GITHUB_OUTPUT"

      # Codex needs Node, so it is always installed; the other toolchains only when
      # configured.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.status == 'running'
        with:
          node-version: ${{ steps.harness.outputs.node }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.status == 'running' && steps.harness.outputs.python != ''
        with:
          python-version: ${{ steps.harness.outputs.python }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.gate.outputs.status == 'running' && steps.harness.outputs.go != ''
        with:
          go-version: ${{ steps.harness.outputs.go }}
          # This job can only restore, so the post-job save would always be refused.
          cache: false

      - name: Set up pnpm, Codex, and setup.root
        if: steps.gate.outputs.status == 'running'
        env:
          PNPM: ${{ steps.harness.outputs.pnpm }}
        run: |
          if [[ "$PNPM" == true ]]; then
            # The version comes from packageManager in package.json on the default branch.
            # A pinned corepack, because Node 25 and later no longer bundle one and older
            # bundled ones reject current npm registry signatures.
            npm install --global corepack@0.36.0
            corepack enable pnpm
            pnpm --version
          fi
          npm install --global @openai/codex@0.154.0
          # Services and system packages, from the root-owned copy. The model key is not
          # in this step. sudo resets the environment; PATH is passed on so the script
          # sees the configured toolchains.
          if [[ -s /opt/nightshift-harness/setup-root.sh ]]; then
            sudo env PATH="$PATH" bash -eo pipefail /opt/nightshift-harness/setup-root.sh
          fi

      - name: Start the model key proxy
        if: steps.gate.outputs.status == 'running'
        env:
          NIGHTSHIFT_MODEL_API_KEY: ${{ secrets.model-api-key }}
          BASE_URL: ${{ steps.harness.outputs.base-url }}
        run: |
          # The key proxy runs as its own user and receives the key on stdin only, so
          # no process the agent can inspect ever holds it.
          proxy_home=/run/nightshift-keyproxy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin nightshift-keyproxy
          sudo install -d -o nightshift-keyproxy -g nightshift-keyproxy -m 755 "$proxy_home"
          printf '%s' "$NIGHTSHIFT_MODEL_API_KEY" | sudo -u nightshift-keyproxy \
            env PATH="$PATH" HOME="$proxy_home" CODEX_HOME="$proxy_home" \
            setsid codex responses-api-proxy \
              --upstream-url "${BASE_URL%/}/responses" \
              --server-info "$proxy_home/info.json" > /dev/null 2>&1 &
          for _ in $(seq 1 60); do [[ -s "$proxy_home/info.json" ]] && break; sleep 0.5; done
          port="$(jq -r .port "$proxy_home/info.json" 2>/dev/null || true)"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then echo "::error::The model key proxy did not start."; exit 1; fi
          echo "Key proxy on port $port"

      - name: Drop root
        if: steps.gate.outputs.status == 'running'
        run: |
          # Keep this before any step that checks out or runs branch content.
          sudo chmod 600 /var/run/docker.sock 2>/dev/null || true
          sudo sh -c 'rm -f /etc/sudoers.d/*'
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo still works after dropping root; not running the agent."
            exit 1
          fi
          echo "sudo disabled"

      - name: Prepare the working branch
        id: branch
        if: steps.gate.outputs.status == 'running'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTSHIFT_BRANCH: ${{ steps.harness.outputs.branch }}
          GIT_NAME: ${{ steps.harness.outputs.identity-name }}
          GIT_EMAIL: ${{ steps.harness.outputs.identity-email }}
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          # The checkout keeps no credentials, and a private repository needs them. The
          # header is passed per command, so the token is never stored in the checkout.
          fetch() {
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              fetch -q origin "$@"
          }
          # Exact same-repository head lookup; fork PRs from branches with the same name
          # never count. The PR head and the branch tip must agree before continuing.
          pr_head="" remote=""
          for _ in $(seq 1 12); do
            fetch "+refs/heads/$NIGHTSHIFT_BRANCH:refs/remotes/origin/$NIGHTSHIFT_BRANCH" || true
            remote="$(git rev-parse -q --verify "refs/remotes/origin/$NIGHTSHIFT_BRANCH" || true)"
            pr_head="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$NIGHTSHIFT_BRANCH&base=$NIGHTSHIFT_BASE&state=open&per_page=100" \
              --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].head.sha // empty')"
            [[ -z "$pr_head" || "$pr_head" == "$remote" ]] && break
            sleep 5
          done
          if [[ -n "$pr_head" && "$pr_head" != "$remote" ]]; then
            echo "::error::The Nightshift PR head and branch tip disagree; skipping this run."
            exit 1
          fi
          if [[ -n "$pr_head" ]]; then
            # Continue the open PR and bring in anything merged to the default branch since.
            git checkout -B "$NIGHTSHIFT_BRANCH" "$remote"
            if ! git merge --no-edit "refs/remotes/origin/$NIGHTSHIFT_BASE"; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=continue" >> "$GITHUB_OUTPUT"
            echo "remote=$remote" >> "$GITHUB_OUTPUT"
          else
            # No open PR: the last batch was merged or discarded. Start fresh from the
            # default branch.
            git checkout -B "$NIGHTSHIFT_BRANCH" "refs/remotes/origin/$NIGHTSHIFT_BASE"
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies from the default branch
        # Fresh mode only: the checkout is the default branch. On a continued branch the
        # agent installs dependencies itself, so no branch code runs before the agent step.
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.mode == 'fresh'
        run: |
          if [[ -s /opt/nightshift-harness/setup-install.sh ]]; then
            bash -eo pipefail /opt/nightshift-harness/setup-install.sh
          fi

      - name: Collect owner replies and open-issue snapshot
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTSHIFT_BRANCH: ${{ steps.harness.outputs.branch }}
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          out="$RUNNER_TEMP/nightshift"
          # The agent cannot call GitHub, so give it a read-only snapshot of the open
          # issues the owner wrote. Issues from anyone else are left out.
          gh issue list --state open --limit 100 --json number,title,labels,author,body \
            | jq -r --arg owner "$OWNER" '.[]
              | select(.author.login == $owner)
              | select([.labels[].name] | index("nightshift") | not)
              | "### #\(.number) \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body[0:6000])\n"' \
            > "$out/issues.md"
          echo "Issue snapshot: $(grep -c '^### #' "$out/issues.md" || true) issues"
          # Only the owner's comments reach the agent; anyone can comment on a public
          # repository.
          gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 30 \
            --json number,title,body,comments \
            | jq -r --arg owner "$OWNER" '.[] |
              "### Issue #\(.number): \(.title)\n\n\(.body)\n\n" +
              ([.comments[] | select(.author.login == $owner) |
                "**Owner reply (\(.createdAt)):**\n\n\(.body)\n"] | join("\n")) + "\n"' \
            > "$out/inbox.md"
          # Unresolved review findings and failing checks on the open PR, so the agent
          # can fix what blocks the merge. Only the owner's and code scanning's threads count.
          bash /opt/nightshift-harness/pr-feedback.sh report > "$out/pr-feedback.md" || : > "$out/pr-feedback.md"

      - name: Run agent
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        continue-on-error: true
        # Literal values and an absolute shell, so nothing written to GITHUB_ENV or
        # GITHUB_PATH earlier can point the agent at another harness or model endpoint.
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          NIGHTSHIFT_HARNESS: /opt/nightshift-harness
          NIGHTSHIFT_OUT: ${{ runner.temp }}/nightshift
          NIGHTSHIFT_DEADLINE: ${{ steps.prep.outputs.deadline }}
          NIGHTSHIFT_MODEL: ${{ inputs.model || steps.harness.outputs.model }}
          NIGHTSHIFT_FALLBACK_MODEL: ${{ steps.harness.outputs.fallback-model }}
          NIGHTSHIFT_MAX_SESSIONS: ${{ steps.harness.outputs.max-sessions }}
          NIGHTSHIFT_RUN_ID: ${{ github.run_id }}
          NIGHTSHIFT_MODE: ${{ steps.branch.outputs.mode }}
          NIGHTSHIFT_BASE: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          port="$(jq -r .port /run/nightshift-keyproxy/info.json)"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "::error::Key proxy port unavailable"; exit 1; }
          NIGHTSHIFT_MODEL_URL="http://127.0.0.1:$port/v1" /usr/bin/bash "$NIGHTSHIFT_HARNESS/run.sh"

      - name: Save memory and discard leftovers
        id: tidy
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          BASE: ${{ steps.branch.outputs.base }}
          NIGHTSHIFT_OUT: ${{ runner.temp }}/nightshift
        run: |
          # Unstage everything and drop merge or cherry-pick state, so only the memory
          # files can be committed here; the rest is discarded below.
          git merge --abort 2>/dev/null || true
          git cherry-pick --abort 2>/dev/null || true
          git reset -q
          # Only the memory files that changed: `git add` fails on a path that does not exist.
          memory=()
          for f in .nightshift/STATE.md .nightshift/JOURNAL.md; do
            if [[ -n "$(git status --porcelain -- "$f")" ]]; then memory+=("$f"); fi
          done
          if ((${#memory[@]} > 0)); then
            git add -A -- "${memory[@]}"
            git commit -m "chore(nightshift): update run memory"
          fi
          leftovers="$(git status --porcelain)"
          if [[ -n "$leftovers" ]]; then
            { echo '### Discarded uncommitted changes'; echo '```'; sed -n '1,50p' <<<"$leftovers"; echo '```'; } >> "$NIGHTSHIFT_OUT/notes.md"
            git reset -q --hard HEAD && git clean -fdq
          fi
          if [[ "$(git rev-parse HEAD)" != "$BASE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle new commits
        id: bundle
        if: steps.tidy.outputs.changed == 'true'
        env:
          REMOTE: ${{ steps.branch.outputs.remote }}
          NIGHTSHIFT_OUT: ${{ runner.temp }}/nightshift
        run: |
          # Everything already on the remote is excluded; publish verifies the rest.
          excludes=("refs/remotes/origin/$NIGHTSHIFT_BASE")
          if [[ -n "$REMOTE" ]]; then excludes+=("$REMOTE"); fi
          git bundle create "$NIGHTSHIFT_OUT/branch.bundle" HEAD --not "${excludes[@]}"
          echo "bundle=true" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.tidy.outputs.changed == 'true'
        timeout-minutes: 30
        continue-on-error: true
        env:
          NIGHTSHIFT_OUT: ${{ runner.temp }}/nightshift
        run: |
          # A quick pre-push signal from the configured checks. The PR's own CI is the
          # merge gate.
          : > "$NIGHTSHIFT_OUT/verify.md"
          mapfile -t checks < /opt/nightshift-harness/checks.txt
          for cmd in "${checks[@]}"; do
            [[ -n "${cmd//[[:space:]]/}" ]] || continue
            if timeout -k 1m 10m bash -eo pipefail -c "$cmd" < /dev/null > "$NIGHTSHIFT_OUT/verify.log" 2>&1; then
              echo "- \`$cmd\`: pass" >> "$NIGHTSHIFT_OUT/verify.md"
            else
              cat "$NIGHTSHIFT_OUT/verify.log"
              {
                echo "- \`$cmd\`: FAIL"
                tail -n 40 "$NIGHTSHIFT_OUT/verify.log" | sed 's/^/    /'
              } >> "$NIGHTSHIFT_OUT/verify.md"
            fi
          done

      - name: Hand results to the publish job
        if: always() && steps.gate.outputs.status == 'running'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightshift-out
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/nightshift
            !${{ runner.temp }}/nightshift/codex-home

  publish:
    needs: agent
    # Not on cancel: cancelling a run means nothing from it is published.
    if: ${{ !cancelled() && needs.agent.outputs.status == 'running' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: none
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Configuration the agent job read from the default branch before the agent ran.
      NIGHTSHIFT_BRANCH: ${{ needs.agent.outputs.branch }}
      GIT_NAME: ${{ needs.agent.outputs.identity-name }}
      GIT_EMAIL: ${{ needs.agent.outputs.identity-email }}
      CI_WORKFLOW: ${{ needs.agent.outputs.ci-workflow }}
      CI_APPROVAL: ${{ needs.agent.outputs.ci-approval }}
      MODE: ${{ needs.agent.outputs.mode }}
      # The run's base commit, not the default branch (that is NIGHTSHIFT_BASE).
      BASE: ${{ needs.agent.outputs.base }}
      REMOTE: ${{ needs.agent.outputs.remote }}
      CONFLICT: ${{ needs.agent.outputs.conflict }}
      HAS_BUNDLE: ${{ needs.agent.outputs.bundle }}
      AGENT_RESULT: ${{ needs.agent.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    # Everything from the agent job is untrusted. This job runs no repository code, and
    # its own notes live outside the downloaded artifact.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.NIGHTSHIFT_BASE }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: nightshift-out
          path: ${{ runner.temp }}/nightshift

      - name: Validate, rewrite, and push the agent's commits
        id: publish
        if: env.HAS_BUNDLE == 'true'
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          out="$RUNNER_TEMP/nightshift"
          mkdir -p "$out" "$RUNNER_TEMP/publish"
          notes="$RUNNER_TEMP/publish/notes.md"
          remote_url="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GH_REPO.git"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          reject() {
            printf '**Not published.** %s\n\n' "$1" >> "$notes"
            echo "::error::$1"
            exit 0
          }
          open_pr() {
            gh api "repos/$GH_REPO/pulls?head=$OWNER:$NIGHTSHIFT_BRANCH&base=$NIGHTSHIFT_BASE&state=open&per_page=100" \
              --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].number // empty'
          }
          # Captured before anything from the bundle is fetched; later checks use SHAs
          # and fully qualified refs only.
          git fetch -q "$remote_url" "+refs/heads/$NIGHTSHIFT_BRANCH:refs/remotes/origin/$NIGHTSHIFT_BRANCH" || true
          current="$(git rev-parse -q --verify "refs/remotes/origin/$NIGHTSHIFT_BRANCH" || true)"

          heads="$(git bundle list-heads "$out/branch.bundle" 2>/dev/null | awk '{print $2}')" \
            || reject "The commit bundle could not be read."
          [[ "$heads" == "HEAD" ]] || reject "The commit bundle names refs other than HEAD."
          git bundle verify -q "$out/branch.bundle" || reject "The commit bundle did not verify."
          git fetch -q --no-tags "$out/branch.bundle" "HEAD:refs/nightshift/candidate" || reject "The commit bundle could not be fetched."
          candidate="$(git rev-parse refs/nightshift/candidate)"

          # BASE was recorded before the agent ran: the default branch's tip, or the open
          # PR's head with the default branch merged in. The agent's commits must sit on
          # top of it.
          base_sha="$(git rev-parse "refs/remotes/origin/$NIGHTSHIFT_BASE")"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || reject "The run's base commit is missing."
          git merge-base --is-ancestor "$BASE" "$candidate" || reject "The agent's commits do not build on the run's base commit."
          if [[ "$MODE" == continue ]]; then
            if [[ "$BASE" != "$REMOTE" ]] && ! git merge-base --is-ancestor "$BASE" "$base_sha"; then
              read -r _ p1 p2 extra < <(git rev-list --parents -n1 "$BASE")
              if [[ -n "$extra" || "$p1" != "$REMOTE" || -z "$p2" ]] || ! git merge-base --is-ancestor "$p2" "$base_sha"; then
                reject "The run's base is not a merge of $NIGHTSHIFT_BASE into the PR head."
              fi
            fi
          else
            git merge-base --is-ancestor "$BASE" "$base_sha" || reject "The run's base is not on $NIGHTSHIFT_BASE."
          fi
          [[ -z "$(git rev-list --merges "$BASE..$candidate")" ]] || reject "The agent created merge commits."
          # Additions, edits, deletions, and moves under .github/ are all refused.
          git diff --quiet --no-renames "$BASE" "$candidate" -- .github \
            || reject "The agent changed files under .github/, which Nightshift never publishes."

          # Closing the PR discards its work, including work that was running when it
          # closed. The PR is queried before the default branch is refetched, so a merge
          # that lands in between still shows up as merged rather than closed.
          if [[ "$MODE" == continue ]]; then
            pr="$(open_pr)" || reject "Could not check whether the Nightshift PR is still open."
            git fetch -q "$remote_url" "+refs/heads/$NIGHTSHIFT_BASE:refs/remotes/origin/$NIGHTSHIFT_BASE" \
              || reject "Could not fetch $NIGHTSHIFT_BASE."
            base_sha="$(git rev-parse "refs/remotes/origin/$NIGHTSHIFT_BASE")"
            if [[ -z "$pr" ]] && ! git merge-base --is-ancestor "$REMOTE" "$base_sha"; then
              reject "The Nightshift PR was closed during this run, so its work stays discarded. The next run starts fresh from $NIGHTSHIFT_BASE."
            fi
          else
            pr="$(open_pr)" || reject "Could not check for an open Nightshift PR."
            [[ -z "$pr" ]] || reject "A Nightshift PR (#$pr) opened during this run; this run's commits were not published over it."
          fi

          # Configured identity and no AI attribution on this run's commits only.
          git checkout -q -B "$NIGHTSHIFT_BRANCH" "$candidate"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --env-filter '
              export GIT_AUTHOR_NAME="$GIT_NAME" GIT_COMMITTER_NAME="$GIT_NAME"
              export GIT_AUTHOR_EMAIL="$GIT_EMAIL" GIT_COMMITTER_EMAIL="$GIT_EMAIL"' \
            --msg-filter 'grep -viE "^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))" || true' \
            "$BASE..HEAD" >/dev/null || reject "Rewriting commit identity failed; nothing was pushed."

          # If the branch moved during the run (for example a reply merge brought the
          # default branch in), build on top of it instead of discarding either side.
          if [[ "$MODE" == continue && -n "$current" && "$current" != "$REMOTE" ]]; then
            git merge-base --is-ancestor "$REMOTE" "$current" \
              || reject "The Nightshift branch was rewritten during the run; this run's commits were not published."
            git merge --no-edit "$current" || { git merge --abort; reject "The Nightshift branch moved during the run and merging it conflicts."; }
          fi

          git -c core.hooksPath=/dev/null push -q --force-with-lease="refs/heads/$NIGHTSHIFT_BRANCH:$current" \
            "$remote_url" "HEAD:refs/heads/$NIGHTSHIFT_BRANCH" \
            || reject "Pushing to \`$NIGHTSHIFT_BRANCH\` failed; it changed while this run was publishing. The commits are kept in the nightshift-out artifact of $RUN_URL for 7 days."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Update the draft PR and approve its CI
        id: pr
        if: steps.publish.outputs.published == 'true'
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          out="$RUNNER_TEMP/nightshift"
          notes="$RUNNER_TEMP/publish/notes.md"
          # The agent describes the whole branch in pr.md: a title line, then the body.
          default_title="chore(nightshift): scheduled nightshift work"
          title=""
          body="$RUNNER_TEMP/publish/pr-body.md"
          # shellcheck disable=SC2016 # Markdown backticks, not command substitutions.
          if [[ -s "$out/pr.md" ]]; then
            title="$(head -n1 "$out/pr.md" | sed -E 's/^#+ *//; s/^[[:space:]]+//; s/[[:space:]]+$//' | cut -c1-120)"
            tail -n +2 "$out/pr.md" | head -c 60000 \
              | sed -E 's/[Hh][Ee][Aa][Dd][[:space:]]*[Cc][Oo][Mm][Mm][Ii][Tt]/head-commit/g' \
              | grep -viE '^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))' \
              > "$body" || true
            [[ -s "$body" ]] || printf '## Summary\n\nSee `.nightshift/JOURNAL.md`.\n' > "$body"
          else
            printf '## Summary\n\nWork from scheduled Nightshift runs toward the goal in `.nightshift/GOALS.md`. Per-run detail is in `.nightshift/JOURNAL.md`.\n' > "$body"
          fi
          pr="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$NIGHTSHIFT_BRANCH&base=$NIGHTSHIFT_BASE&state=open&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].number // empty')"
          if [[ -z "$pr" ]]; then
            if [[ "$MODE" == continue ]] && ! git merge-base --is-ancestor "$REMOTE" "refs/remotes/origin/$NIGHTSHIFT_BASE"; then
              # Closed between the publish check and the push: do not reopen it.
              printf '**The Nightshift PR was closed while this run published, so no PR was reopened.** The next run starts fresh from %s.\n\n' "$NIGHTSHIFT_BASE" >> "$notes"
              exit 0
            fi
            # Some plans have no draft PRs for private repositories; a ready PR works the same.
            gh pr create --draft --base "$NIGHTSHIFT_BASE" --head "$NIGHTSHIFT_BRANCH" --title "${title:-$default_title}" --body-file "$body" \
              || gh pr create --base "$NIGHTSHIFT_BASE" --head "$NIGHTSHIFT_BRANCH" --title "${title:-$default_title}" --body-file "$body"
          elif [[ -n "$title" ]]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          fi

          # CI on a PR opened by github-actions waits for approval, and the default branch
          # only counts checks from the PR's own CI. Approve only this branch's pending CI
          # runs, so a fork PR pointed at the same commit is never approved along with it.
          if [[ -z "$CI_WORKFLOW" ]]; then
            echo "No merge.ci_workflow configured; nothing to approve."
            exit 0
          fi
          # The CI runs agent-written code, so it is approved only when the harness found
          # the workflow safe for that (read-only permissions, no secrets) or the owner
          # opted in with merge.approve_ci: always.
          if [[ "$CI_APPROVAL" != allowed ]]; then
            printf '**CI needs your approval.** Not approved automatically (%s). Review the change, then approve the run in the Actions tab.\n\n' "${CI_APPROVAL#denied: }" >> "$notes"
            exit 0
          fi
          [[ "$CI_WORKFLOW" == */* ]] || CI_WORKFLOW=".github/workflows/$CI_WORKFLOW"
          export CI_WORKFLOW
          head="$(git rev-parse HEAD)"
          ids=""
          for _ in $(seq 1 24); do
            ids="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&status=action_required&event=pull_request" \
              --jq '.workflow_runs[] | select(.path == env.CI_WORKFLOW and .head_repository.full_name == env.GH_REPO and .head_branch == env.NIGHTSHIFT_BRANCH) | .id' \
              || true)"
            [[ -n "$ids" ]] && break
            sleep 5
          done
          # shellcheck disable=SC2016 # Markdown backticks, not command substitutions.
          if [[ -z "$ids" ]]; then
            printf '**CI not approved yet.** No pending CI run appeared for %s; a `merge` reply approves it.\n\n' "${head:0:7}" >> "$notes"
          else
            for id in $ids; do
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
                echo "Approved pending CI run $id"
              else
                printf '**CI not approved yet.** Could not approve CI run %s; a `merge` reply retries.\n\n' "$id" >> "$notes"
              fi
            done
          fi

      - name: Open owner questions, close resolved ones, post run report
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          # gh prints an API error's JSON body on stdout, even with --jq. Keep stdout only on
          # success, so a capture with a fallback never mistakes an error for data.
          gh() { local out; out="$(command gh "$@")" || return; [[ -z "$out" ]] || printf '%s\n' "$out"; }
          gh label create "$NEEDS_YOU_LABEL" --color B60205 --description "Nightshift is waiting on the owner" --force || true
          gh label create nightshift --color 5319E7 --description "Nightshift runs" --force || true
          out="$RUNNER_TEMP/nightshift"
          notes="$RUNNER_TEMP/publish/notes.md"
          mkdir -p "$out/questions" "$RUNNER_TEMP/publish"

          # Agent-controlled text (including commit subjects and file names) is shown
          # only as literal, size-bounded, fenced text that cannot hide or impersonate
          # the trusted sections, and cannot contain the head-commit marker.
          neutralize() { sed -E 's/[Hh][Ee][Aa][Dd][[:space:]]*[Cc][Oo][Mm][Mm][Ii][Tt]/head-commit/g'; }
          literal() {
            local text n fence
            text="$(head -c "$1" | neutralize)"
            n="$( { grep -oE '`+' <<<"$text" || true; } | awk '{ if (length($0) > m) m = length($0) } END { print m + 1 }')"
            ((n < 3)) && n=3
            fence="$(printf '%*s' "$n" '' | tr ' ' '`')"
            printf '%s\n%s\n%s\n' "$fence" "$text" "$fence"
          }

          opened=""
          if [[ "$CONFLICT" == "true" ]]; then
            conflict_title="Nightshift: Merging $NIGHTSHIFT_BASE into the $NIGHTSHIFT_BRANCH branch conflicts"
            existing="$(gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 100 --json number,title,url \
              | jq -r --arg t "$conflict_title" 'map(select(.title == $t)) | .[0] // empty | "\(.number) \(.url)"' || true)"
            if [[ -n "$existing" ]]; then
              read -r n url <<<"$existing"
              gh issue comment "$n" --body "Still conflicting with $NIGHTSHIFT_BASE as of $RUN_URL. Runs are skipped until it is resolved." || true
              opened+="- $url (still open)"$'\n'
            else
              url="$(gh issue create --label "$NEEDS_YOU_LABEL" --label nightshift --title "$conflict_title" \
                --body "@$OWNER The open Nightshift PR conflicts with $NIGHTSHIFT_BASE. Resolve the conflicts on the \`$NIGHTSHIFT_BRANCH\` branch, or close the PR to discard it. Runs are skipped until then. Run: $RUN_URL" || true)"
              [[ -n "$url" ]] && opened+="- $url"$'\n'
            fi
          fi

          max_q=5 asked=0 skipped=0
          for q in "$out"/questions/*.md; do
            [[ -f "$q" ]] || continue
            if ((asked >= max_q)); then skipped=$((skipped + 1)); continue; fi
            asked=$((asked + 1))
            title="$(head -n1 "$q" | sed 's/^#* *//' | cut -c1-100)"
            [[ -n "$title" ]] || title="Question from Nightshift"
            body="$(printf '@%s\n\n%s\n\n---\nReply here. A reply from @%s starts a run immediately; comments from anyone else are ignored. Run: %s\n' \
              "$OWNER" "$(tail -n +2 "$q" | head -c 20000 | neutralize)" "$OWNER" "$RUN_URL")"
            if url="$(gh issue create --label "$NEEDS_YOU_LABEL" --label nightshift --title "Nightshift: $title" --body "$body")"; then
              opened+="- $url"$'\n'
            else
              echo "::warning::Could not open question $(basename "$q")"
            fi
          done
          ((skipped == 0)) || opened+="- $skipped more questions were not opened; see the nightshift-out artifact."$'\n'

          if [[ -s "$out/resolved.txt" ]]; then
            sed -nE 's/^#?([0-9]+).*/\1/p' "$out/resolved.txt" | sort -u | head -n 20 | while read -r n; do
              if gh issue view "$n" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$NEEDS_YOU_LABEL"; then
                gh issue close "$n" --comment "Resolved in Nightshift run $RUN_URL" || echo "::warning::Could not close #$n"
              fi
            done || true
          fi

          pr_json="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$NIGHTSHIFT_BRANCH&base=$NIGHTSHIFT_BASE&state=open&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0] // empty' || true)"

          # Trusted sections first, agent text after, head marker last.
          {
            echo "@$OWNER Nightshift run finished: $RUN_URL"
            echo
            if [[ "$AGENT_RESULT" != "success" ]]; then
              echo "**The agent job ended with: $AGENT_RESULT.** See the run for details."; echo
            fi
            if [[ "$HAS_BUNDLE" == "true" && "$PUBLISHED" != "true" ]] && ! [[ -s "$notes" ]]; then
              echo "**Not published.** The publish step ended with: $PUBLISH_OUTCOME. The commits are only in the nightshift-out artifact of the run (kept 7 days)."; echo
            fi
            if [[ "$PUBLISHED" == "true" && "$PR_OUTCOME" != "success" ]]; then
              echo "**The commits were pushed, but updating the PR ended with: $PR_OUTCOME.**"; echo
            fi
            [[ -s "$notes" ]] && { cat "$notes"; echo; }
            if [[ "$PUBLISHED" == "true" ]]; then
              echo "**Commits pushed**"
              # This run's own commits only, not ones brought in from the default branch.
              git log --no-merges --format='%h %s' HEAD --not "$BASE" "refs/remotes/origin/$NIGHTSHIFT_BASE" | head -n 50 | cut -c1-120 | literal 8000
            fi
            if [[ -n "$pr_json" ]]; then
              pr_head="$(jq -r .head.sha <<<"$pr_json")"
              git fetch -q "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/$GH_REPO.git" "$pr_head" 2>/dev/null || true
              echo "**Files changed vs $NIGHTSHIFT_BASE** (from git)"
              git diff --name-status --no-renames "refs/remotes/origin/$NIGHTSHIFT_BASE...$pr_head" 2>/dev/null | head -n 200 | literal 12000
              echo "**Review:** $(jq -r .html_url <<<"$pr_json")"
              echo
            fi
            [[ -n "$opened" ]] && { echo "**Questions for you**"; echo "$opened"; }
            true
          } > "$RUNNER_TEMP/publish/report-head.md"
          {
            echo "**Sessions** (from the agent job)"
            literal 4000 < "$out/sessions.log" 2>/dev/null || echo "none"
            if [[ -s "$out/verify.md" ]]; then echo "**Agent job checks** (from the agent job)"; literal 8000 < "$out/verify.md"; fi
            if [[ -s "$out/summary.md" ]]; then echo "**Agent summary** (written by the agent)"; literal 20000 < "$out/summary.md"; fi
            if [[ -s "$out/notes.md" ]]; then echo "**Agent notes** (written by the agent)"; literal 8000 < "$out/notes.md"; fi
          } > "$RUNNER_TEMP/publish/report-agent.md"
          : > "$RUNNER_TEMP/publish/report-tail.md"
          if [[ -n "$pr_json" ]]; then
            {
              echo
              # Must stay the last head-commit line: merge.yml binds a reply to it.
              echo "Head commit: \`$(jq -r .head.sha <<<"$pr_json")\`"
              echo
              echo "Reply \`merge\` to this email to merge exactly that commit into $NIGHTSHIFT_BASE once its checks pass."
            } > "$RUNNER_TEMP/publish/report-tail.md"
          fi
          # GitHub comments are capped at 65,536 characters; the agent section yields.
          budget=$((60000 - $(wc -c < "$RUNNER_TEMP/publish/report-head.md") - $(wc -c < "$RUNNER_TEMP/publish/report-tail.md")))
          {
            cat "$RUNNER_TEMP/publish/report-head.md"
            if ((budget > 0)); then head -c "$budget" "$RUNNER_TEMP/publish/report-agent.md"; echo; fi
            cat "$RUNNER_TEMP/publish/report-tail.md"
          } > "$RUNNER_TEMP/publish/report.md"

          log_issue="$(gh issue list --label nightshift --state open --limit 100 --json number,title \
            | jq -r --arg t "$LOG_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          if [[ -z "$log_issue" ]]; then
            log_issue="$(gh issue create --label nightshift --title "$LOG_ISSUE_TITLE" \
              --body "One comment per Nightshift run. Reply \`merge\` to a run's email to merge its PR. Pause runs by setting \`status: paused\` in \`.nightshift/GOALS.md\` on $NIGHTSHIFT_BASE.")"
          fi
          gh issue comment "$log_issue" --body-file "$RUNNER_TEMP/publish/report.md"
